spring.application.name=mpesaWallet

# Server configuration (default port 8081; instance 2 runs on 8082)
server.port=${PORT:8081}

# Request thread budget: exactly 50 per instance (Spec constraint)
server.tomcat.threads.max=50

# Database connection: PostgreSQL 15+
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mpesa_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari connection pool budget: exactly 10 connections, 2000ms timeout (Spec constraint)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

# Formatting
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
